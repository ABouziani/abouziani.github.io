<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Radar Chart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .chart-container {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h2>Responsive Radar Chart</h2>

    <div class="chart-container">
        <svg id="radarChart" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet">
            <!-- Background Circle -->
            <circle cx="250" cy="250" r="200" stroke="#ccc" stroke-width="2" fill="none" />
            
            <!-- Radar Axes -->
            <line x1="250" y1="50" x2="250" y2="450" stroke="#aaa" stroke-width="2"/>
            <line x1="50" y1="250" x2="450" y2="250" stroke="#aaa" stroke-width="2"/>
            <line x1="100" y1="100" x2="400" y2="400" stroke="#aaa" stroke-width="2"/>
            <line x1="100" y1="400" x2="400" y2="100" stroke="#aaa" stroke-width="2"/>
            
            <!-- Radar Data Polygon -->
            <polygon points="250,100 400,250 300,400 200,350 100,250" 
                     fill="rgba(0, 150, 255, 0.4)" stroke="blue" stroke-width="2"/>

            <!-- Labels -->
            <text x="250" y="40" font-size="14" text-anchor="middle">Skill 1</text>
            <text x="460" y="255" font-size="14">Skill 2</text>
            <text x="300" y="420" font-size="14" text-anchor="middle">Skill 3</text>
            <text x="180" y="420" font-size="14" text-anchor="middle">Skill 4</text>
            <text x="40" y="255" font-size="14">Skill 5</text>
        </svg>
    </div>

</body>
</html>
